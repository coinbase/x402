kind: Added
body: Add the SVM `upto` scheme (client, server, facilitator) for usage-based billing on Solana, backed by hand-written payment-channels program bindings in mechanisms/svm/paymentchannels. The client escrows a maximum in an onchain channel, the server signs a voucher for the metered amount, and the facilitator sponsors fees/rent, co-signs and broadcasts the open, settles the claim, and can reclaim channel rent through RentCleanupManager over a pluggable ChannelStorage
