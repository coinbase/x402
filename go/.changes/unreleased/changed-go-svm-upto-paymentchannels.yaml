kind: changed
body: >-
  Refactor SVM upto onto shared paymentchannels: move open, settle, close,
  reclaim, rent cleanup, discovery, and facilitator channel work out of
  upto/facilitator; replace hand-rolled instructions with codegen-generated
  payment-channels client types and builders; add onchain helpers,
  PaymentChannelFacilitatorSigner with AssertPaymentChannelFacilitatorSigner, and
  an LRU channel-PDA cache (4096 entries). Upto client uses shared svm
  ResolveBlockhash and ResolveOpenSlot and paymentchannels requirement helpers.
  Extend FacilitatorSvmSigner with SimulationRPCOpts and an optional
  simulate-transaction options argument (breaking for custom signers); add
  optional FacilitatorConfirmedTransactionReader and blockhash-validity caps for
  batch-style recovery. Regenerate payment-channels client via updated codegen
  script and CI check. Delegate upto rent cleanup to paymentchannels
  RentCleanupManager.
time: 2026-09-28T10:00:00Z
