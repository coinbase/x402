kind: added
body: Add a `settlement_pending` error reason for the `exact` and `upto` EVM schemes. A receipt-wait failure after a settlement transaction broadcast (e.g. an RPC error or timeout) now returns `settlement_pending` with the broadcast transaction hash and network instead of a terminal error, since the transaction may still confirm on chain. Settlement now also validates the broadcast transaction hash before waiting on it, so a signer that reports success without a usable hash fails terminally rather than reporting `settlement_pending` without a hash to reconcile against.
