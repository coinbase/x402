kind: added
body: Add a `settlement_pending` error reason for the `exact` and `upto` EVM schemes. A receipt-wait failure after a settlement transaction broadcast (e.g. an RPC error or timeout) now returns `settlement_pending` with the broadcast transaction hash and network instead of a terminal error, since the transaction may still confirm on chain. Also guards the ERC-20 approval gas sponsoring settlement branch against proceeding to wait on an empty transaction hash if the extension signer returns no hashes without an error.
