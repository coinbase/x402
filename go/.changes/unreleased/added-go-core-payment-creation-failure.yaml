kind: added
body: >-
  Add optional SchemeNetworkClient PaymentCreationFailureHandler so schemes can
  recover from a failed CreatePaymentPayload after user hooks. Introduce
  WithPaymentRequired to attach the full 402 challenge on context; HTTP
  PaymentRoundTripper and MCP clients pass it when retrying after
  OnPaymentResponse recovery so handlers can fall back to a sibling accept (for
  example client-signed batch-settlement when server-signed is untrusted).
  Centralize hook and scheme recovery in recoverCreationFailure; extend
  PaymentCreationFailureContext with PaymentRequired.
time: 2026-09-28T10:00:00Z
