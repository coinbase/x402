kind: added
body: 'Add facilitator-delegated receiver authorization to the auth-capture EVM scheme. A server without a ReceiverAuthorizerSigner sends unsigned charge, capture, void and refund payloads (voidRemainder replaces voidAuthorizerSignature) and the facilitator signs them after ResolveCallerIdentity authenticates the caller, binding the identity to the paymentInfoHash in a DelegatedAuthStorage (InMemoryAuthCaptureDelegatedAuthStorage for local use). The server resolves self, delegated or collect-only per route, with Config.CollectOnlyRoutes and ValidateFacilitatorSupport checks. An omitted route receiverAuthorizer no longer implies collect-only: set it to the zero address explicitly. Replace the dedicated auth-capture client example with the base HTTP client example.'
time: 2026-10-05T14:30:00.000000+02:00
