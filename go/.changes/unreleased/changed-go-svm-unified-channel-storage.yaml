kind: changed
body: >-
  Unify SVM upto and batch-settlement facilitator channel storage on
  paymentchannels.PaymentChannelStorage. Opens and activity are recorded before
  broadcast and a failed write does not broadcast. A failed open is reverted;
  activity is kept. The receiver-authorizer binding and delegated caller identity
  live on that row. Upto ChannelStorage, DelegatedAuthStore, and the batch
  receiver-authorizer and delegated-auth stores are removed. Delegated mode
  requires a caller-identity callback and writes that identity on the same
  channel row.
time: 2026-09-28T17:10:00Z
