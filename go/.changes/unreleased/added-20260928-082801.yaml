kind: added
body: 'Add PaywallConfig.RPCURLs (browser RPC endpoint per chain, keyed by CAIP-2). The Solana paywall uses it for the balance check and for building the payment transaction instead of the public api.mainnet-beta.solana.com, which rejects browser requests. Chains without an entry keep the public default.'
