kind: fixed
body: >-
  Fix batch-settlement charged-amount baseline when the server has no local
  channel record (after a full refund, idle auto-refund, or restart). The server
  now uses the facilitator-verified onchain totalClaimed instead of inferring it
  from the client voucher, and rejects the request if it is missing. The
  facilitator now requires non-refund vouchers and deposits to advance
  maxClaimableAmount to at least totalClaimed + amount (and strictly above
  totalClaimed), rejects a malformed or negative requirements amount, and the
  server parses totalClaimed with one canonical rule (no leading zeros, bounded
  numeric fallback).
time: 2026-10-01T12:00:00Z
