[package]
name = "timechain"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.15", features = ["serde"] }
ndarray-linalg = { version = "0.16" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
tokio = { version = "1.44", features = ["full"] }
rayon = "1.7"
num-traits = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
num-complex = "0.4"
rustfft = "6.1"
