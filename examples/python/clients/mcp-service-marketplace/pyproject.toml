[project]
name = "mcp-service-marketplace-client"
version = "0.1.0"
description = "x402 agent client — discovers and pays for LogicNodes MCP workers autonomously"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "x402>=2.10.0",
    "coinbase-cdp-sdk>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
